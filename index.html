Description: A password manager with delete, encryption, show/hide, and Bootstrap styling.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- Page title shown on browser tab -->
  <title>Password Manager</title>
  
  <!-- Bootstrap 5 for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
  <!-- Main container to center the content on the page -->
  <div class="container mt-5">
    
    <!-- App title -->
    <h2 class="text-center mb-4">🔐 Password Manager</h2>
    
    <!-- Form to input website, username, and password -->
    <form id="password-form" class="card p-4 shadow-sm">
      <input type="text" id="website" class="form-control mb-2" placeholder="Website" required />
      <input type="text" id="username" class="form-control mb-2" placeholder="Username" required />
      <input type="password" id="password" class="form-control mb-2" placeholder="Password" required />
      <button type="submit" class="btn btn-primary w-100">Add Password</button>
    </form>

    <!-- Section to display saved passwords -->
    <div id="passwords" class="mt-4">
      <h4>Saved Passwords</h4>
      
      <!-- Passwords will be added here dynamically by JavaScript -->
      <ul id="password-list" class="list-group"></ul>
    </div>
  </div>

  <!-- JavaScript file with logic for adding, deleting, and encrypting passwords -->
  <script src="script.js"></script>
</body>
</html>
